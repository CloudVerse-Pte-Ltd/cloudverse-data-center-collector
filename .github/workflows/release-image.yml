name: release-image
on:
  workflow_dispatch:
  push:
    tags: ['collector-image-v*']
permissions: {contents: read, packages: write, id-token: write, attestations: write}
jobs:
  build-sign-attest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
    - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
    - id: image
      shell: bash
      run: |
        name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cloudverse-data-center-collector"
        ref="${name}:${GITHUB_REF_NAME}"
        docker buildx build --platform linux/amd64,linux/arm64 --provenance=mode=max --sbom=true --push --metadata-file /tmp/build.json -t "$ref" -t "${name}:latest" .
        digest="$(jq -r '.["containerimage.digest"]' /tmp/build.json)"
        test "$digest" != null && test -n "$digest"
        echo "name=$name" >> "$GITHUB_OUTPUT"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
    - run: syft '${{ steps.image.outputs.ref }}@${{ steps.image.outputs.digest }}' -o spdx-json=cloudverse-data-center-collector.spdx.json
    - uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
      with: {subject-name: '${{ steps.image.outputs.name }}', subject-digest: '${{ steps.image.outputs.digest }}', sbom-path: cloudverse-data-center-collector.spdx.json, push-to-registry: true}
    - run: cosign sign --yes '${{ steps.image.outputs.ref }}@${{ steps.image.outputs.digest }}'
